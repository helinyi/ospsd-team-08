[project]
name = "ospsd-team-08"
version = "0.1.0"
description = "OSPSD Team 08 — Chat client with Discord implementation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "requests>=2.32.5",
    "uvicorn>=0.42.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.1",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.0.0",
]

[tool.uv.workspace]
members = ["components/*"]

# ruff configuration borrowed from https://github.com/nyu/oss-taapp-example/blob/root/pyproject.toml
[tool.ruff]
line-length = 130 # high for top level due to tests
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203", # `incorrect-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible. Ignoring `incorrect-blank-line-before-class`.
  "D213", # `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible. Ignoring `multi-line-summary-second-line`.
  "S101", # Use of `assert` detected --> Asserts are good in our opinion. Tests use asserts profusely.
  "COM812", # Conflicts with ruff formatter
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["T201"]  # main.py is a CLI entry point, print is expected
"**/test*.py" = [
    "D",
    "ANN",
    "PLR2004",
    "PLW0108",
    "I001",
    "S101",
    "SLF001",
    "ARG001",
    "ARG002",
    "INP001",
    "PLC0415",
]
"**/tests/**" = ["D", "ANN", "PLR2004", "PLW0108", "I001"]
"**/discord_service_api_client/**" = ["ALL"]  # auto-generated code, not manually maintained
"**/test_*.py" = ["D", "ANN", "PLR2004", "PLW0108", "I001", "S101", "SLF001", "ARG001", "ARG002", "INP001", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = [
    "components/chat_client_api/src",
    "components/discord_client_impl/src",
    "components/discord_service/src",
]

[[tool.mypy.overrides]]
module = "fast_api_client.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "components"]
addopts = "-v --tb=short"
env_files = [".env"]
pythonpath = [
    "components/chat_client_api/src",
    "components/discord_client_impl/src",
    "components/discord_service/src",
]
markers = [
    "integration: Integration tests for DI verification",
    "circleci: Tests that run in CircleCI",
    "e2e: end-to-end tests",
]

[tool.coverage.run]
branch = true
source = ["components"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.15.1",
    "types-requests>=2.32.0",
]
