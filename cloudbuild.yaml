steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "us-east4-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/discord-service:$COMMIT_SHA"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-east4-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/discord-service:$COMMIT_SHA"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "discord-service"
      - "--image"
      - "us-east4-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/discord-service:$COMMIT_SHA"
      - "--region"
      - "us-east4"
      - "--port"
      - "8080"
      - "--allow-unauthenticated"

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "us-east4-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/discord-service:$COMMIT_SHA"
