[project]
name = "discord-service"
version = "0.1.0"
dependencies = [
    "fastapi",
    "uvicorn",
    "chat-client-api",
    "discord-client-impl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_service"]

[tool.uv.sources]
chat-client-api = { workspace = true }
discord-client-impl = { workspace = true }