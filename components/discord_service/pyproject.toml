[project]
name = "discord-service"
version = "0.1.0"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "itsdangerous", 
    "starlette",
    "chat-client-api",
    "discord-client-impl",
    "calendar-integration",
    "google-calendar-adapter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_service"]

[tool.uv.sources]
chat-client-api = { git = "https://github.com/HarshithKoriRaj/Shared-API.git" }
discord-client-impl = { workspace = true }
calendar-integration = { workspace = true }
google-calendar-adapter = { workspace = true }