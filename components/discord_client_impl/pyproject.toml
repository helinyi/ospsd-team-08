[project]
name = "discord-client-impl"
version = "0.1.0"
description = "Discord implementation of the chat-client-api interface"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chat-client-api",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_client_impl"]


[tool.uv.sources]
chat-client-api = { workspace = true }