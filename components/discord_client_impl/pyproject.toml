[project]
name = "discord-client-impl"
version = "0.1.0"
description = "Discord implementation of the chat-client-api interface"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chat-client-api",
    "python-dotenv>=1.2.2",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_client_impl"]


[tool.uv.sources]
chat-client-api = { git = "https://github.com/HarshithKoriRaj/Shared-API.git" }

[dependency-groups]
dev = [
    "types-requests>=2.32.4.20260107",
]
