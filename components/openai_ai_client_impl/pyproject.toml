[project]
name = "openai-ai-client-impl"
version = "0.1.0"
description = "OpenAI implementation of the AI client interface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.0.0",
  "ai-client-api",
  "chat-client-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openai_ai_client_impl"]

[tool.uv.sources]
ai-client-api = { workspace = true }
