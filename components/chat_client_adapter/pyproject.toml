[project]
name = "chat-client-adapter"
version = "0.1.0"
description = "Adapter for ChatClient using Discord service API client"
requires-python = ">=3.13"

dependencies = [
    "chat-client-api",
    "fast-api-client",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_client_adapter"]
